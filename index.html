<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Diamond Rush</title>
     <link rel="stylesheet" href="style.css">
</head>

<body>
     <div class="game-container">
          <div class="game-wrapper">
          <p id="game-status">Collect all diamonds and gifts to open the door!</p>

               <div class="game">
                    <span class="player">🧍</span>
               </div>
          </div>
          <div class="btn-container">
               <div class="info">
                    <div class="counts-cont">
                         <span id="diamond-count">💎 0/40</span>
                         <span id="gift-count">🎁 0/5</span>
                    </div>    
                    <button type="button" class="btn" id="start" onclick="startGame()">Restart</button>
               </div>
               <div class="power-up-cont">
                    <span id="fire">🔥</span>
                    <span id="sword">🗡️</span>
                    <span id="dimensions">🌀</span>
               </div>
               <div class="move-btns">
                    <button type="button" class="move btn dimension" id="top-left">↑</button>
                    <button type="button" class="move btn" id="up">↑</button>
                    <button type="button" class="move btn dimension" id="top-right">→</button>
                    <button type="button" class="move btn" id="left">←</button>
                    <button type="button" class="move btn" id="special"></button>
                    <button type="button" class="move btn" id="right">→</button>
                    <button type="button" class="move btn dimension" id="bottom-left">←</button>
                    <button type="button" class="move btn" id="down">↓</button>
                    <button type="button" class="move btn dimension" id="bottom-right">↓</button>
               </div>
          </div>
     </div>


     <script src="script.js"></script>
     <script src="control.js"></script>
</body>

</html>
