<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Diamond Rush</title>
     <link rel="stylesheet" href="style.css">
     <link rel="manifest" href="manifest.json">
</head>

<body>
     <div class="game-container">
          <div class="info">
               <div class="counts-cont">
                    <span class="count" id="d-count"></span>
                    <span class="count" id="r-d-count"></span>
               </div>
               <span id="peach">🍑</span>
               <button type="button" class="btn" id="start"></button>
          </div>

          <div class="game-wrapper">
               <span id="game-status-container">
                    <p id="game-status">Collect all diamonds and gifts to open the door!</p>
               </span>
               <div class="game">
                    <span class="player">🧍</span>
               </div>
          </div>

          <div class="btn-container">
               <div id="jump">💠</div>
               
               <div class="move-btns">
                    <button type="button" class="move btn dimension" id="top-left">↑</button>
                    <button type="button" class="move btn" id="up">↑</button>
                    <button type="button" class="move btn dimension" id="top-right">→</button>
                    <button type="button" class="move btn" id="left">←</button>
                    <button type="button" class="move btn" id="attack"></button>
                    <button type="button" class="move btn" id="right">→</button>
                    <button type="button" class="move btn dimension" id="bottom-left">←</button>
                    <button type="button" class="move btn" id="down">↓</button>
                    <button type="button" class="move btn dimension" id="bottom-right">↓</button>
               </div>
          </div>
     </div>

     <script type="module" src="script.js"></script>
     <script type="module" src="msg.js"></script>
</body>

</html>
